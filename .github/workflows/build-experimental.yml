name: Build RE-UE4SS Experimental

on:
  push:
    branches:
      - experimental-latest
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: experimental-latest

      - name: Fix Submodule URLs in .gitmodules
        run: |
          (Get-Content .gitmodules) -replace 'Re-UE4SS', 'UE4SS-RE' | Set-Content .gitmodules
          git submodule sync

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure xmake Project
        run: xmake f -m "Game__Shipping__Win64" -v -y

      - name: Build Binaries
        run: xmake -v

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UE4SS-Experimental-Win64
          path: |
            build/**/bin/**/*.dll
            build/**/bin/**/*.lib
            bin/
